services:
  # --- Volatility Predictor Agent ---
  - type: web
    name: forge-volatility-predictor
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/agents/volatility-predictor.js
    envVars:
      - key: PORT
        value: 7378
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --- Liquidation Analyzer Agent ---
  - type: web
    name: forge-liquidation-analyzer
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/agents/liquidation-analyzer.js
    envVars:
      - key: PORT
        value: 7378
      - key: LIQUIDATION_AGENT_PORT
        value: 7378
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --- Sentiment Tracker Agent ---
  - type: web
    name: forge-sentiment-tracker
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/agents/sentiment-tracker.js
    envVars:
      - key: PORT
        value: 7378
      - key: SENTIMENT_AGENT_PORT
        value: 7378
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --- Pattern Matcher Agent ---
  - type: web
    name: forge-pattern-matcher
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/agents/pattern-matcher.js
    envVars:
      - key: PORT
        value: 7378
      - key: PATTERN_AGENT_PORT
        value: 7378
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --- Forge Synthesizer Agent ---
  - type: web
    name: forge-synthesizer
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/agents/forge-synthesizer.js
    envVars:
      - key: PORT
        value: 7378
      - key: SYNTHESIZER_AGENT_PORT
        value: 7378
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --- API Server ---
  - type: web
    name: forge-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/api/server.js
    envVars:
      - key: API_SERVER_PORT
        value: 3000
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
