services:
  volatility-predictor:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_ENTRYPOINT: dist/agents/volatility-predictor.js
    ports:
      - "7378:7378"
    env_file: .env
    environment:
      - PORT=7378

  liquidation-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_ENTRYPOINT: dist/agents/liquidation-analyzer.js
    ports:
      - "7379:7378"
    env_file: .env
    environment:
      - PORT=7378
      - LIQUIDATION_AGENT_PORT=7378

  sentiment-tracker:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_ENTRYPOINT: dist/agents/sentiment-tracker.js
    ports:
      - "7380:7378"
    env_file: .env
    environment:
      - PORT=7378
      - SENTIMENT_AGENT_PORT=7378

  pattern-matcher:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_ENTRYPOINT: dist/agents/pattern-matcher.js
    ports:
      - "7381:7378"
    env_file: .env
    environment:
      - PORT=7378
      - PATTERN_AGENT_PORT=7378

  forge-synthesizer:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_ENTRYPOINT: dist/agents/forge-synthesizer.js
    ports:
      - "7382:7378"
    env_file: .env
    environment:
      - PORT=7378
      - SYNTHESIZER_AGENT_PORT=7378

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_ENTRYPOINT: dist/api/server.js
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - API_SERVER_PORT=3000

  forge-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - volatility-predictor
      - liquidation-analyzer
      - sentiment-tracker
      - pattern-matcher
      - forge-synthesizer
      - api-server
